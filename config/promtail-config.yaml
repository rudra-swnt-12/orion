server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: 'fake_app_logs'
  static_configs:
  - targets:
      - localhost
    labels:
      job: 'fake_app'
      __path__: /mnt/logs/fake_app.log # This tells Promtail to scrape every .log file in /var/log