
networks:
  monitoring:

volumes:
  log_storage:

services:
  fake_app:
    build: .  # Tells Docker to use the Dockerfile in this directory
    container_name: fake_app
    ports:
      - "8080:8080"
    volumes:
      - log_storage:/app/logs # Mounts the shared volume into the app's log dir
    networks:
      - monitoring
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-local-config.yaml
    volumes:
      - ./config:/etc/loki
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./config:/etc/promtail
      - log_storage:/mnt/logs # This tells Promtail to read all logs from the host's /var/log dir
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config:/etc/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    networks:
      - monitoring
    depends_on:
      - fake_app

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring